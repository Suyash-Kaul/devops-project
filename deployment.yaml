apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-robot-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: my-robot
  template:
    metadata:
      labels:
        app: my-robot
    spec:
      containers:
      - name: robot
        image: suyash28/my-robot-app:latest
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: my-robot-service
spec:
  selector:
    app: my-robot
  ports:
  - port: 80
    targetPort: 5000
  type: LoadBalancer   